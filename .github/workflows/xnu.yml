name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      board:
        description: SWEET board variant (sweet / jackpotlte = Galaxy A8 2018 / k88 = ZTE K88 tablet)
        default: sweet
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main, k88]   # pushes to k88 build board=k88 (see SWEET_BOARD below)
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}
  # read by makedefs/MakeInc.def (patch 0082)
  SWEET_BOARD: ${{ inputs.board || (github.ref_name == 'k88' && 'k88') || 'sweet' }}

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-15-intel   # macos-14 was retired (2026-11-12: "not supported"); the step below picks the oldest Xcode
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          if [ "$SWEET_BOARD" = jackpotlte ] || [ "$SWEET_BOARD" = k88 ]; then
            # Apple clang's default arm64 CPU has LSE; Cortex-A53/A73 are ARMv8.0
            # (xcodebuild rejects [arch=...] conditionals on the command line)
            sed -i '' "s/VALID_ARCHS=\"x86_64 arm64e arm64\"/& 'OTHER_CFLAGS=\$(inherited) \$(SWEET_ARCH_CFLAGS_\$(CURRENT_ARCH))' 'SWEET_ARCH_CFLAGS_arm64=-mcpu=generic -march=armv8-a'/" dxb/build.sh
            grep -c 'SWEET_ARCH_CFLAGS_arm64=' dxb/build.sh
          fi
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree-${{ env.SWEET_BOARD }}
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - name: ISA check (instructions an ARMv8.0 core cannot execute)
        if: always() && (env.SWEET_BOARD == 'jackpotlte' || env.SWEET_BOARD == 'k88')
        run: |
          # Cortex-A53/A73 are ARMv8.0: LSE atomics (8.1), RDM (8.1), RCpc
          # loads (8.3) and non-hint pointer-auth instructions are UNDEFINED.
          # Closed libraries (libcc_kext) are not compiled with our -march.
          k=$(find out -maxdepth 1 -type f -name 'kernel.*' ! -name '*.txt' | head -1)
          xcrun llvm-objdump -d --no-show-raw-insn "$k" > out/kernel.dis
          re='[[:space:]](cas|casa|casl|casal|casp|caspa|caspl|caspal|casb|cash|casab|casah|casalb|casalh|caslb|caslh|ld(add|clr|eor|set|smax|smin|umax|umin)(a|l|al)?(b|h)?|st(add|clr|eor|set|smax|smin|umax|umin)(l)?(b|h)?|swp(a|l|al)?(b|h)?|sqrdml[as]h|ldapr[bh]?|ldapur[bh]?|retaa|retab|braa|brab|blraa|blrab|braaz|brabz|blraaz|blrabz|eretaa|eretab|ldraa|ldrab|sdot|udot)([[:space:]]|$)'
          grep -E "$re" out/kernel.dis > out/isa-v81.txt || true
          echo "ARMv8.1+ instructions: $(wc -l < out/isa-v81.txt)"
          # attribute each hit to its function
          awk -v re="$re" '/^[0-9a-f]+ <.*>:$/ {fn=$2} $0 ~ re {n[fn]++} END {for (f in n) print n[f], f}' out/kernel.dis | sort -rn | head -40 | tee out/isa-v81-functions.txt
          rm out/kernel.dis

      - name: A8 payload (mkadt + mkpayload)
        if: always() && env.SWEET_BOARD == 'jackpotlte'
        run: |
          # Linked into the A8 shim on the PC: PAYLOAD=... shim/a8/build.sh, then tools/mka8boot.py
          k=$(find out -maxdepth 1 -type f -name 'kernel.*' ! -name '*.txt' ! -name '*.a' | head -1)
          python3 -I tools/mkadt.py out/jackpotlte.adt --device jackpotlte
          # rd=ufsroot0: root on the eMMC GPT partition USERDATA (0093, read-only)
          python3 -I tools/mkpayload.py "$k" out/jackpotlte.adt out/xnu-jackpotlte.payload --cmdline 'debug=0xc serial=3 cpus=1 keepsyms=1 rd=ufsroot0'
          ls -l out/jackpotlte.adt out/xnu-jackpotlte.payload

      - name: K88 payload (mkadt + mkpayload)
        if: always() && env.SWEET_BOARD == 'k88'
        run: |
          # Linked into the K88 shim on the PC: PAYLOAD=... shim/k88/build.sh, then tools/mkqcomboot.py
          k=$(find out -maxdepth 1 -type f -name 'kernel.*' ! -name '*.txt' ! -name '*.a' | head -1)
          python3 -I tools/mkadt.py out/k88.adt --device k88
          # no root device yet (SDHCI driver to come): the boot waits for root;
          # sweetreboot=120 comes back to TWRP with the console in ramoops
          python3 -I tools/mkpayload.py "$k" out/k88.adt out/xnu-k88.payload --cmdline 'debug=0xc serial=3 cpus=1 keepsyms=1 sweetreboot=120 sweetfb_fit=1 rd=ufsroot0'
          ls -l out/k88.adt out/xnu-k88.payload

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-${{ env.SWEET_BOARD }}
          path: out/
          if-no-files-found: warn
